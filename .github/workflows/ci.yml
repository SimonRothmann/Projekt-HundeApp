# Führt bei jedem Push und jedem Pull Request die Prüfungen aus, die es im
# Projekt ohnehin gibt - damit ein Abhängigkeits-PR von Dependabot einen
# grünen Haken oder ein rotes Kreuz trägt, statt nur ein Diff zu sein.
#
# Für öffentliche Repositories sind GitHub Actions unbegrenzt kostenlos. Der
# in TECH_STACK.md notierte Verzicht war mit Kosten begründet; diese
# Begründung trägt bei einem öffentlichen Repo nicht.
name: CI

on:
  push:
    branches: [master, prod]
  pull_request:

# Ein neuer Push auf denselben Branch macht den vorherigen Lauf hinfällig.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Bauen
        working-directory: backend
        # -warnaserror: eine neue Compilerwarnung soll hier auffallen und
        # nicht erst beim nächsten Lesen der Deploy-Ausgabe. Der Stand ist
        # warnungsfrei, also kostet das nichts und hält ihn so.
        run: dotnet build -c Release -warnaserror
      - name: Testen
        working-directory: backend
        run: dotnet test -c Release --no-build

  frontend:
    # Ohne Versionsnummer im Namen: die steht im Dockerfile und darf sich
    # dort ändern, ohne dass ein Job-Titel etwas Falsches behauptet.
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Die Node-Version kommt aus dem Dockerfile, statt hier noch einmal
      # zu stehen. Fest verdrahtet war sie ein stiller Fehler: als Dependabot
      # am 2026-09-09 das Basis-Image von node:22-slim auf 26-slim heben
      # wollte, lief die CI weiter auf 22 und setzte einen grünen Haken unter
      # eine Änderung, die sie gar nicht geprüft hatte. Grün heißt nur etwas,
      # wenn geprüft wurde, was sich geändert hat.
      - name: Node-Version aus dem Dockerfile lesen
        id: node
        run: |
          v=$(grep -oE 'FROM node:[0-9]+' frontend/Dockerfile | head -1 | cut -d: -f2)
          [ -n "$v" ] || { echo "Keine 'FROM node:<major>'-Zeile in frontend/Dockerfile gefunden." >&2; exit 1; }
          echo "Node-Hauptversion laut Dockerfile: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Abhängigkeiten
        working-directory: frontend
        run: npm ci
      - name: Typen prüfen
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        # --max-warnings: der Stand hat sieben bekannte exhaustive-deps-
        # Warnungen. Sie hier festzuschreiben heißt: bestehende stören nicht,
        # eine achte fällt auf.
        run: npm run lint -- --max-warnings 7
      - name: Tests
        working-directory: frontend
        run: npm test

# Bewusst NICHT Teil der CI: `next build`.
#
# Der Build ist nicht allein aus der Quelle bestimmt - er holt den
# Prüfungsordnungs-Katalog zur Bauzeit über die API und backt daraus Seiten
# und Sitemap (generateStaticParams, app/sitemap.ts, siehe docs/SEO.md). Ohne
# erreichbares Backend entstünde entweder ein Fehlschlag oder, schlimmer, ein
# grüner Lauf mit leerem Katalog. Der Build bleibt deshalb dort, wo ein
# Backend antwortet: in deploy-test.sh, hinter dem Health-Check.
#
# Die Typprüfung oben deckt den Teil ab, den `next build` sonst mitprüfen
# würde, und braucht dafür keine Daten.
