# Führt bei jedem Push und jedem Pull Request die Prüfungen aus, die es im
# Projekt ohnehin gibt - damit ein Abhängigkeits-PR von Dependabot einen
# grünen Haken oder ein rotes Kreuz trägt, statt nur ein Diff zu sein.
#
# Für öffentliche Repositories sind GitHub Actions unbegrenzt kostenlos. Der
# in TECH_STACK.md notierte Verzicht war mit Kosten begründet; diese
# Begründung trägt bei einem öffentlichen Repo nicht.
name: CI

on:
  push:
    branches: [master, prod]
  pull_request:

# Ein neuer Push auf denselben Branch macht den vorherigen Lauf hinfällig.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oeffentlich:
    # Das Repo ist öffentlich: Server-Adressen haben hier nichts zu suchen
    # (Lehre vom 16.11.2026). Erlaubt sind private und lokale Bereiche und
    # Netzbereiche mit Präfix wie die Cloudflare-Liste im Caddyfile.
    name: Keine Server-Adressen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Nach öffentlichen IP-Adressen suchen
        run: |
          treffer=$(git grep -nIoP '(?<![\d.])(\d{1,3}\.){3}\d{1,3}(?![\d./])' -- . ':!**/package-lock.json' ':!**/Migrations/**' ':!*.svg' \
            | grep -vE ':(127\.[0-9.]+|0\.0\.0\.0|10\.[0-9.]+|192\.168\.[0-9.]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9.]+|169\.254\.[0-9.]+)$' || true)
          if [ -n "$treffer" ]; then
            echo "::error::Öffentliche IP-Adresse im Repo - das Repo ist öffentlich, Server-Adressen gehören nicht hinein:"
            echo "$treffer"
            exit 1
          fi
          echo "Keine öffentlichen IP-Adressen gefunden."

  backend:
    name: Backend
    runs-on: ubuntu-latest
    # Echtes Postgres für die Tests unter backend/tests/.../Postgres: Alle anderen
    # Tests laufen gegen EF In-Memory und führen nie SQL aus. Dieselbe
    # Hauptversion wie auf dem Server (docker-compose.yml: postgres:17). Der
    # Container ist nur für diesen Lauf da, das Kennwort ohne Wert außerhalb.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Bauen
        working-directory: backend
        # -warnaserror: eine neue Compilerwarnung soll hier auffallen und
        # nicht erst beim nächsten Lesen der Deploy-Ausgabe. Der Stand ist
        # warnungsfrei, also kostet das nichts und hält ihn so.
        run: dotnet build -c Release -warnaserror
      - name: Testen
        working-directory: backend
        env:
          # Ohne diese Variable würden die Postgres-Tests übersprungen; in der CI
          # lässt das Fehlen sie scheitern (TestSupport/PostgresDatenbank.cs).
          DOGITY_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=ci
        run: dotnet test -c Release --no-build

  frontend:
    # Ohne Versionsnummer im Namen: die steht im Dockerfile und darf sich
    # dort ändern, ohne dass ein Job-Titel etwas Falsches behauptet.
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Die Node-Version kommt aus dem Dockerfile, statt hier noch einmal
      # zu stehen. Fest verdrahtet war sie ein stiller Fehler: als Dependabot
      # am 2026-09-09 das Basis-Image von node:22-slim auf 26-slim heben
      # wollte, lief die CI weiter auf 22 und setzte einen grünen Haken unter
      # eine Änderung, die sie gar nicht geprüft hatte. Grün heißt nur etwas,
      # wenn geprüft wurde, was sich geändert hat.
      - name: Node-Version aus dem Dockerfile lesen
        id: node
        run: |
          v=$(grep -oE 'FROM node:[0-9]+' frontend/Dockerfile | head -1 | cut -d: -f2)
          [ -n "$v" ] || { echo "Keine 'FROM node:<major>'-Zeile in frontend/Dockerfile gefunden." >&2; exit 1; }
          echo "Node-Hauptversion laut Dockerfile: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Abhängigkeiten
        working-directory: frontend
        run: npm ci
      - name: Typen prüfen
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        # --max-warnings: der Stand hat sieben bekannte exhaustive-deps-
        # Warnungen. Sie hier festzuschreiben heißt: bestehende stören nicht,
        # eine achte fällt auf.
        run: npm run lint -- --max-warnings 7
      - name: Tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        # Platzhalter statt Geheimnis: NEXT_PUBLIC_API_URL wird zur Bauzeit
        # eingesetzt (siehe Dockerfile). Die .invalid-Adresse antwortet nie -
        # der Build holt den öffentlichen Katalog dann nicht und backt die
        # Katalogseiten leer. Geprüft wird hier also, dass er baut, nicht
        # mit welchen Daten; die echten Seiten entstehen in deploy-test.sh.
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
        run: npx next build
