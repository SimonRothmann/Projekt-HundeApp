# Sicherheits-Updates sind eine Repo-Einstellung (Settings -> Code security)
# und brauchen hier nichts: sie laufen unabhängig von diesem Zeitplan, sobald
# eine Schwachstelle bekannt wird. Diese Datei regelt nur die regelmäßigen
# Versions-Updates.
#
# Monatlich statt wöchentlich, und gruppiert: zwanzig einzelne PRs im Monat
# liest nach kurzer Zeit niemand mehr, und ein ungelesener Bot ist so gut wie
# keiner. Minor und Patch kommen gebündelt, Major-Sprünge einzeln - die
# brauchen ohnehin je eine eigene Prüfung.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      frontend-klein:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 ist der native Go-Compiler und liefert keine öffentliche
      # Compiler-API mit; die kommt erst mit 7.1. typescript-eslint lehnt die
      # Installation deshalb ausdrücklich ab ("does not support TS 7.0"), und
      # damit stünde die Lint-Stufe der CI still. Am 2026-09-09 ausprobiert
      # und genau daran gescheitert; das Projekt steht deshalb auf TypeScript
      # 6, dem von Microsoft empfohlenen Zwischenschritt.
      # Diesen Eintrag entfernen, sobald typescript-eslint TS >= 7.1 kann
      # (github.com/typescript-eslint/typescript-eslint/issues/10940).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @types/node muss die Node-Version abbilden, gegen die tatsächlich
      # gebaut wird - das ist node:22-slim im frontend/Dockerfile, nicht die
      # neueste Node-Linie. Ein Major-Update hier verspräche dem Compiler
      # APIs, die im Container nicht existieren. Der Sprung gehört zusammen
      # mit dem Basis-Image gemacht, das das docker-Ökosystem weiter unten
      # ohnehin meldet. (Dependabot schlug am 2026-09-09 prompt 26.4.1 vor -
      # genau der Fall.)
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # ESLint 10 ändert die Regel-API. eslint-plugin-react, das über
      # eslint-config-next hereinkommt, kennt sie noch nicht und stirbt
      # schon beim Laden: "TypeError: Error while loading rule
      # 'react/display-name': contextOrFilename.getFilename is not a
      # function". Am 2026-09-09 in der CI nachgemessen (PR #8). Der
      # Blocker sitzt stromaufwärts, nicht bei uns.
      # Entfernen, sobald eslint-config-next ESLint 10 unterstützt.
      - dependency-name: eslint
        update-types: [version-update:semver-major]

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      backend-klein:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Swashbuckle 10 zieht Microsoft.OpenApi v2 nach, das Namensraum und
      # Referenzmodell umgebaut hat: "CS0234: 'Models' does not exist in the
      # namespace 'Microsoft.OpenApi'" (PR #12, 2026-09-09). Das ist eine
      # echte Migration der Swagger-Konfiguration in Program.cs - für eine
      # Oberfläche, die ausschließlich in Development läuft; Prod hat kein
      # Swagger (siehe deploy/README.md). Swashbuckle 7 baut und läuft
      # unverändert gegen net10.0, und es liegt keine Sicherheitsmeldung
      # vor. Bewusst verschoben, nicht vergessen: steht in TODO.md.
      - dependency-name: Swashbuckle.AspNetCore
        update-types: [version-update:semver-major]

  # Die Basis-Images. Genau dieses Ökosystem hätte den .NET-Wechsel von selbst
  # gemeldet: sdk:9.0 -> sdk:10.0 wäre als Update aufgeschlagen, statt dass
  # das Support-Ende am 10.11.2026 zufällig auffällt.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  # Hält die in ci.yml verwendeten Actions aktuell.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
